<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" width="100%" height="100%">
  <!-- Standalone Premium Microphone & Upward Voice Symbol -->
  <defs>
    <linearGradient id="goldPrestige" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F2D06B"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#A8811A"/>
    </linearGradient>
    <linearGradient id="charcoalGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#222226"/>
      <stop offset="100%" stop-color="#141416"/>
    </linearGradient>
  </defs>

  <g transform="translate(120, 115)">
    <!-- Outer Speech Resonance Wave Arcs (Subtle Left & Right Voice Projection) -->
    <path d="M -62 -28 C -74 -10, -74 18, -62 36" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>
    <path d="M 62 -28 C 74 -10, 74 18, 62 36" fill="none" stroke="#D4AF37" stroke-width="4" stroke-linecap="round" stroke-opacity="0.5"/>

    <!-- Outer Cradle / U-Bracket (Obsidian Charcoal) -->
    <path d="M -42 -2 C -42 28, -24 48, 0 48 C 24 48, 42 28, 42 -2" 
          fill="none" 
          stroke="url(#charcoalGrad)" 
          stroke-width="9" 
          stroke-linecap="round"/>

    <!-- Microphone Neck & Base Stand (Architectural Minimalist) -->
    <line x1="0" y1="48" x2="0" y2="76" stroke="url(#charcoalGrad)" stroke-width="8" stroke-linecap="round"/>
    <path d="M -30 76 L 30 76" stroke="url(#charcoalGrad)" stroke-width="8" stroke-linecap="round"/>

    <!-- Central Microphone Capsule Body (Warm Gold) -->
    <!-- Pill Capsule Contour -->
    <rect x="-24" y="-72" width="48" height="84" rx="24" fill="url(#goldPrestige)"/>

    <!-- Subtle Microphone Acoustic Slits / Grille Lines -->
    <line x1="-12" y1="-52" x2="12" y2="-52" stroke="#141416" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-15" y1="-42" x2="15" y2="-42" stroke="#141416" stroke-width="3.5" stroke-linecap="round"/>
    <line x1="-12" y1="-32" x2="12" y2="-32" stroke="#141416" stroke-width="3.5" stroke-linecap="round"/>

    <!-- Confident Ascending Voice / Upward Elevation Arrow Arc integrated in lower capsule -->
    <path d="M -12 -10 Q 0 4 12 -10" fill="none" stroke="#141416" stroke-width="4" stroke-linecap="round"/>

    <!-- Upward Beacon Apex Star / Clarity Pip above mic -->
    <circle cx="0" cy="-88" r="6" fill="#D4AF37"/>
  </g>
</svg>
